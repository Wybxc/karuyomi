required-version = "==0.17.3"
target-version = "py311"
line-length = 88
indent-width = 4
cache-dir = ".tools/ruff-cache"
force-exclude = true
respect-gitignore = true
extend-exclude = ["vendor", ".local", ".tools", "runtime/teavm/.local"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
