name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm flutter:setup
      - run: pnpm protocol:setup
      - name: Initialize pinned TeaVM and libwebp sources
        run: git submodule update --init --depth 1 vendor/teavm vendor/libwebp
      - run: pnpm exec prek validate-config .pre-commit-config.yaml
      - run: pnpm check
      - run: pnpm flutter:check
      - run: pnpm build
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
      - run: pnpm db:migrate:local
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
      - name: Preserve the trusted Web build for production assembly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: |
            apps/reader/build/web
            packages/runtime-host/dist
          if-no-files-found: error
          retention-days: 7
