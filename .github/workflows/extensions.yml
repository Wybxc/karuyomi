name: Incremental extension Static Assets

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: Maximum changed packages (1-24); never initial bootstrap
        type: number
        default: 12

permissions:
  contents: read

concurrency:
  group: extension-static-assets
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      upstream: ${{ steps.plan.outputs.upstream }}
      snapshot_needed: ${{ steps.plan.outputs.snapshot_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - name: Read the deployed static baseline; refuse missing or partial bootstrap
        run: node tools/extensions/pipeline.ts pull-state --state .local/extensions/state.json
      - name: Check planner, static snapshots and descriptor boundaries
        run: |
          pnpm test:extensions
          pnpm test:extension-build
      - name: Follow upstream main without modifying its tracked gitlink
        run: |
          git -C vendor/extensions-source fetch --depth=1 origin main
          git -C vendor/extensions-source checkout --detach FETCH_HEAD
      - name: Generate current shared runtime materials for the compatibility check
        run: pnpm --filter @karuyomi/runtime-host build:materials
      - name: Plan bounded changed inputs
        id: plan
        env:
          BATCH_SIZE: ${{ inputs.batch_size || 12 }}
        run: |
          node tools/extensions/pipeline.ts plan --ci --state .local/extensions/state.json --output .local/extensions/plan.json --limit "$BATCH_SIZE" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-plan
          path: .local/extensions/*.json
          include-hidden-files: true
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - name: Check out exactly the planned upstream source
        env:
          UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream }}
        run: |
          git -C vendor/extensions-source fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git -C vendor/extensions-source checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@v4
        with:
          name: extension-plan
          path: .local/extensions
      - uses: actions/cache@v4
        with:
          path: |
            runtime/teavm/.local/gradle/caches
            runtime/teavm/.local/gradle/wrapper
            runtime/teavm/.local/downloads
            runtime/teavm/.local/runtime-seed
            runtime/teavm/.local/build-cache
            runtime/teavm/.local/jdks
            runtime/teavm/.local/android-sdk
          key: extension-toolchain-${{ runner.os }}-${{ hashFiles('runtime/teavm/toolchain-lock.json') }}
      - name: Prepare checksum-locked runtime seed and Android toolchain
        run: node scripts/prepare-runtime.ts --android
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build and validate one isolated package
        continue-on-error: true
        env:
          INPUT_KEY: ${{ matrix.key }}
        run: node tools/extensions/pipeline.ts build --plan .local/extensions/plan.json --key "$INPUT_KEY" --output "output/$INPUT_KEY"
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: extension-result-${{ matrix.key }}
          path: output/${{ matrix.key }}
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [plan, build]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.snapshot_needed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: karuyomi-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize pinned libwebp sources for runtime materials
        run: git submodule update --init --depth 1 vendor/libwebp
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: extension-plan
          path: .local/extensions
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.count != '0'
        with:
          pattern: extension-result-*
          path: output
      - name: Assemble a complete latest-only candidate from results and deployed bytes
        run: node tools/extensions/pipeline.ts prepare-snapshot --plan .local/extensions/plan.json --state .local/extensions/state.json --results output --assets-dir .local/extensions-assets
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: pnpm flutter:setup
      - name: Build the client and explicitly include the extension snapshot
        run: EXTENSION_ASSETS_DIR="$PWD/.local/extensions-assets" pnpm build
      - name: Refuse a stale publisher before deploying
        run: node tools/extensions/pipeline.ts check-base --assets-dir .local/extensions-assets
      - name: Refuse an obsolete Web client
        run: node scripts/release-web.ts latest --require-latest
      - name: Deploy Static Assets with the app and apply database migrations
        run: |
          pnpm --filter @karuyomi/api exec wrangler deploy
          pnpm --filter @karuyomi/api exec wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confirm the deployed snapshot before committing its checkpoint
        run: node tools/extensions/pipeline.ts commit-snapshot --state .local/extensions/state.json --assets-dir .local/extensions-assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-deployment-checkpoint
          path: .local/extensions/state.json
          include-hidden-files: true
          retention-days: 30
