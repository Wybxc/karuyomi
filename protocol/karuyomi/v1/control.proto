syntax = "proto3";

package karuyomi.v1;

// Small control DTOs only. HTTP bodies and processed image bytes travel through
// their independently bounded binary streams/transferables, never these DTOs.

message Empty {}

enum RuntimeErrorCode {
  RUNTIME_ERROR_CODE_UNSPECIFIED = 0;
  RUNTIME_ERROR_CODE_CANCELLED = 1;
  RUNTIME_ERROR_CODE_TIMEOUT = 2;
  RUNTIME_ERROR_CODE_ACCESS_REQUIRED = 3;
  RUNTIME_ERROR_CODE_ACCESS_DENIED = 4;
  RUNTIME_ERROR_CODE_SOURCE_ERROR = 5;
  RUNTIME_ERROR_CODE_UNSUPPORTED_CAPABILITY = 6;
  RUNTIME_ERROR_CODE_RUNTIME_LOST = 7;
  RUNTIME_ERROR_CODE_PROTOCOL_ERROR = 8;
  RUNTIME_ERROR_CODE_INTEGRITY_ERROR = 9;
  RUNTIME_ERROR_CODE_LIMIT_EXCEEDED = 10;
  RUNTIME_ERROR_CODE_STORAGE_BUSY = 11;
}

message RuntimeError {
  RuntimeErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  optional string java_class = 4;
}

message RuntimeHello {
  uint32 protocol_version = 1;
  string host_abi = 2;
  string runtime_baseline = 3;
  string generation = 4;
  repeated string capabilities = 5;
  bool source_ready = 6;
}

message SourceInfo {
  // Opaque signed 64-bit decimal identity; never a JavaScript number.
  string id = 1;
  string name = 2;
  string lang = 3;
  optional bool supports_latest = 4;
  optional string base_url = 5;
}

message RuntimeSession {
  uint32 protocol_version = 1;
  string worker_instance_id = 2;
  string generation = 3;
  string build_id = 4;
  repeated SourceInfo sources = 5;
  repeated string capabilities = 6;
}

message RpcEnvelope {
  uint32 protocol_version = 1;
  string worker_instance_id = 2;
  string generation = 3;
  string build_id = 4;
  string request_id = 5;
}

message OpenRequest {
  string manifest_path = 1;
  string identity = 2;
  optional string user_agent = 3;
  optional string expected_build_id = 4;
  optional string expected_bundle_sha256 = 5;
  PreferenceBootstrap preference_bootstrap = 6;
}

message Manga {
  string url = 1;
  string title = 2;
  optional string author = 3;
  optional string artist = 4;
  optional string description = 5;
  optional string genre = 6;
  repeated string genres = 7;
  int32 status = 8;
  optional string thumbnail_url = 9;
  bool initialized = 10;
  string update_strategy = 11;
  // The only extension-defined JSON escape hatch. A bounded UTF-8 JSON object,
  // opaque to TS/Dart so large JSON numeric lexemes survive a round trip.
  optional string memo_json = 12;
}

message Chapter {
  string url = 1;
  string name = 2;
  optional float chapter_number = 3;
  optional string scanlator = 4;
  // Opaque signed int64 decimal text from the original Source.
  string date_upload = 5;
  uint32 source_order = 6;
  optional string memo_json = 7;
}

message Page {
  string page_key = 1;
  uint32 index = 2;
  int32 source_index = 3;
  string url = 4;
  optional string image_url = 5;
}

message PageRequest {
  uint32 page = 1;
}
// Filter paths use zero-based indexes from the top-level list. Snapshots are
// ephemeral and belong to the Source and generation that produced them.
message FilterText {
  string state = 1;
}
message FilterCheckBox {
  bool state = 1;
}
message FilterTriState {
  // Original Source states: 0 ignore, 1 include, 2 exclude.
  uint32 state = 1;
}
message FilterSelect {
  repeated string options = 1;
  uint32 state = 2;
}
message FilterSortSelection {
  uint32 index = 1;
  bool ascending = 2;
}
message FilterSortState {
  // Absence explicitly means the Source's nullable sort selection.
  optional FilterSortSelection selection = 1;
}
message FilterSort {
  repeated string options = 1;
  FilterSortState state = 2;
}
message FilterGroup {
  repeated FilterNode nodes = 1;
}
message FilterNode {
  string name = 1;
  oneof kind {
    Empty header = 2;
    Empty separator = 3;
    FilterText text = 4;
    FilterCheckBox check_box = 5;
    FilterTriState tri_state = 6;
    FilterSelect select = 7;
    FilterSort sort = 8;
    FilterGroup group = 9;
  }
}
message GetFiltersRequest {
  // Keep the client's applied snapshot while publishing a fresh draft.
  optional string retained_snapshot_id = 1;
}
message FilterSnapshot {
  string snapshot_id = 1;
  repeated FilterNode nodes = 2;
}
message FilterUpdate {
  repeated uint32 path = 1;
  oneof state {
    string text = 2;
    bool check_box = 3;
    uint32 tri_state = 4;
    uint32 select = 5;
    FilterSortState sort = 6;
  }
}
message FilterSelection {
  string snapshot_id = 1;
  // Every editable leaf is supplied, including false, zero and null sort.
  repeated FilterUpdate updates = 2;
}
message SearchRequest {
  uint32 page = 1;
  string query = 2;
  // Omission requests the Source defaults; a present selection is explicit.
  FilterSelection filters = 3;
}
message MangaRequest {
  Manga manga = 1;
}
message ChapterRequest {
  Chapter chapter = 1;
}

// Typed Android Source preferences. Storage entries describe the real
// `source_<id>` SharedPreferences namespace, including listener alias writes.
message PreferenceStringSet {
  repeated string values = 1;
}
message PreferenceValue {
  oneof value {
    bool boolean = 1;
    string text = 2;
    sint32 integer = 3;
    float decimal = 4;
    PreferenceStringSet strings = 5;
    sint64 long_integer = 6;
  }
}
message PreferenceEntry {
  string key = 1;
  PreferenceValue value = 2;
}
message SourcePreferenceValues {
  string source_id = 1;
  repeated PreferenceEntry entries = 2;
}
message PreferenceBootstrap {
  string package_name = 1;
  // Only namespaces with values need an entry. Missing keys use Source defaults.
  repeated SourcePreferenceValues sources = 2;
}
enum PreferenceValueKind {
  PREFERENCE_VALUE_KIND_UNSPECIFIED = 0;
  PREFERENCE_VALUE_KIND_BOOLEAN = 1;
  PREFERENCE_VALUE_KIND_TEXT = 2;
  PREFERENCE_VALUE_KIND_INTEGER = 3;
  PREFERENCE_VALUE_KIND_DECIMAL = 4;
  PREFERENCE_VALUE_KIND_STRINGS = 5;
  PREFERENCE_VALUE_KIND_LONG_INTEGER = 6;
}
message PreferenceSyncRule {
  string key = 1;
  PreferenceValueKind kind = 2;
  // Missing means the approved key has the same meaning throughout this package.
  optional string source_id = 3;
}
// Constructed by the host from the package's owned policy, never from a Source
// claiming that arbitrary keys are safe to send to the business API.
message PreferenceHostConfiguration {
  PreferenceBootstrap bootstrap = 1;
  repeated PreferenceSyncRule sync_rules = 2;
}
enum PreferenceSyncScope {
  PREFERENCE_SYNC_SCOPE_UNSPECIFIED = 0;
  PREFERENCE_SYNC_SCOPE_CLIENT_SESSION = 1;
  PREFERENCE_SYNC_SCOPE_ACCOUNT = 2;
}
message PreferenceOption {
  string label = 1;
  string value = 2;
}
message PreferenceToggle {
  bool value = 1;
}
message PreferenceText {
  // Missing is distinct from an explicitly stored empty string.
  optional string value = 1;
  bool secret = 2;
  int32 input_type = 3;
}
message PreferenceChoice {
  repeated PreferenceOption options = 1;
  optional string value = 2;
}
message PreferenceMultiChoice {
  repeated PreferenceOption options = 1;
  repeated string values = 2;
}
message PreferenceGroup {
  repeated PreferenceNode nodes = 1;
}
message PreferenceUnsupported {
  string reason = 1;
}
message PreferenceNode {
  string key = 1;
  string title = 2;
  string summary = 3;
  bool enabled = 4;
  bool visible = 5;
  PreferenceSyncScope sync_scope = 6;
  PreferenceValue default_value = 7;
  oneof kind {
    PreferenceToggle toggle = 10;
    PreferenceText text = 11;
    PreferenceChoice choice = 12;
    PreferenceMultiChoice multi_choice = 13;
    PreferenceGroup group = 14;
    Empty action = 15;
    PreferenceUnsupported unsupported = 16;
  }
}
message PreferenceSnapshot {
  string snapshot_id = 1;
  repeated PreferenceNode nodes = 2;
  // Full actual stored values in each partition; never upload session_values.
  repeated PreferenceEntry sync_values = 3;
  repeated PreferenceEntry session_values = 4;
}
message PreferenceEditRequest {
  string snapshot_id = 1;
  repeated uint32 path = 2;
  oneof command {
    PreferenceValue change = 3;
    Empty click = 4;
  }
}
message PreferenceEditResult {
  bool accepted = 1;
  bool click_handled = 2;
  PreferenceSnapshot snapshot = 3;
}

message SourceCall {
  string request_id = 1;
  string source_id = 2;
  optional uint32 timeout_ms = 3;
  string generation = 4;
  oneof request {
    PageRequest popular = 10;
    PageRequest latest = 11;
    SearchRequest search = 12;
    MangaRequest details = 13;
    MangaRequest chapters = 14;
    ChapterRequest pages = 15;
    GetFiltersRequest get_filters = 16;
    Empty get_preferences = 17;
    PreferenceEditRequest edit_preference = 18;
  }
}

message MangaPage {
  repeated Manga mangas = 1;
  bool has_next_page = 2;
}
message ChapterList {
  repeated Chapter chapters = 1;
}
message PageList {
  string page_session_id = 1;
  repeated Page pages = 2;
}

message SourceResult {
  string request_id = 1;
  string generation = 2;
  string build_id = 3;
  oneof payload {
    MangaPage manga_page = 10;
    Manga manga = 11;
    ChapterList chapters = 12;
    PageList page_list = 13;
    FilterSnapshot filters = 14;
    PreferenceSnapshot preferences = 15;
    PreferenceEditResult preference_edit = 16;
  }
}

message CancelSourceRequest {
  string request_id = 1;
  string generation = 2;
}
message AcquireImage {
  string request_id = 1;
  string source_id = 2;
  string page_session_id = 3;
  string page_key = 4;
  string generation = 5;
  optional uint32 timeout_ms = 6;
}
message CancelImage {
  string request_id = 1;
  string generation = 2;
}
message ReleaseImage {
  string resource_id = 1;
  string generation = 2;
}
message ClosePageSession {
  string page_session_id = 1;
  string generation = 2;
}
message Released {
  bool released = 1;
}
message Closed {
  bool closed = 1;
}
message Completed {
  bool completed = 1;
}

// An opaque Source-processed body. Image interpretation belongs to the UI.
message ProcessedImage {
  string resource_id = 1;
  string generation = 2;
  uint32 byte_length = 3;
}
message ImageResource {
  string resource_id = 1;
  string generation = 2;
  uint32 byte_length = 3;
  string url = 4;
}

message ImageMeta {}
message ImageData {
  uint32 seq = 1;
  uint32 byte_length = 2;
}
message ImageEnd {
  uint32 seq = 1;
  uint32 total_bytes = 2;
}
message ImageAck {
  uint32 seq = 1;
  optional ProcessedImage resource = 2;
}
message ImageFrameControl {
  oneof frame {
    ImageMeta meta = 1;
    ImageData data = 2;
    ImageEnd end = 3;
    ImageAck ack = 4;
    RuntimeError abort = 5;
  }
}

message Artifact {
  string path = 1;
  string sha256 = 2;
  uint32 size = 3;
  optional string content_type = 4;
  optional string logical_name = 5;
}
message BundleArtifact {
  string path = 1;
  string sha256 = 2;
  uint32 size = 3;
  string content_type = 4;
  string encoding = 5;
  string encoded_sha256 = 6;
  uint32 encoded_size = 7;
}
// Display metadata from the unchanged official extension build.
// Runtime capabilities still come from actual Source initialization.
message CatalogSource {
  string id = 1;
  string name = 2;
  string lang = 3;
}
message BuildManifest {
  uint32 protocol_version = 1;
  string host_abi = 2;
  string runtime_baseline = 3;
  uint32 bridge_version = 4;
  string build_id = 5;
  string package_name = 6;
  string repo_id = 7;
  string version = 8;
  string storage_schema = 9;
  repeated string source_ids = 10;
  BundleArtifact bundle = 11;
  repeated Artifact host_scripts = 12;
  repeated Artifact resources = 13;
  // Complete metadata for exactly source_ids, without running the extension.
  repeated CatalogSource sources = 14;
}
message ExtensionBuildDescriptor {
  string build_id = 1;
  string package_name = 2;
  string repo_id = 3;
  string version = 4;
  repeated string source_ids = 5;
  string manifest_path = 6;
  repeated CatalogSource sources = 7;
}
message ExtensionIndex {
  uint32 schema_version = 1;
  repeated ExtensionBuildDescriptor builds = 2;
  // The current latest-only index is complete. There is no pagination cursor.
}
message Identity {
  string subject = 1;
  string email = 2;
}
enum BootstrapStage {
  BOOTSTRAP_STAGE_UNSPECIFIED = 0;
  BOOTSTRAP_STAGE_SCAFFOLD = 1;
  BOOTSTRAP_STAGE_P0 = 2;
}
message Bootstrap {
  uint32 protocol_version = 1;
  Identity identity = 2;
  // Millisecond/second epoch value supplied by the existing Access endpoint;
  // semantic validation requires a positive safe integer.
  double expires_at = 3;
  BootstrapStage stage = 4;
}
message ApiFetchRequest {
  string path = 1;
  optional string method = 2;
  map<string, string> headers = 3;
  optional string body = 4;
}
message ApiFetchResponse {
  uint32 status = 1;
  map<string, string> headers = 2;
  string body = 3;
  bool redirected = 4;
}

// Local preparation never constructs or executes a Source.
message PrepareBuildRequest {
  string preparation_id = 1;
  ExtensionBuildDescriptor build = 2;
}
message CancelPreparationRequest {
  string preparation_id = 1;
}
message PreparedBuild {
  ExtensionBuildDescriptor build = 1;
  string bundle_sha256 = 2;
  uint32 byte_length = 3;
}
message CachedExtensionArtifact {
  string sha256 = 1;
  uint32 byte_length = 2;
  string content_type = 3;
}
message ExtensionCacheState {
  repeated CachedExtensionArtifact artifacts = 1;
  uint32 total_bytes = 2;
  uint32 max_bytes = 3;
  uint32 max_artifacts = 4;
}
message ForgetExtensionArtifactRequest {
  string sha256 = 1;
}
message CloseBuildRequest {
  string build_id = 1;
  string generation = 2;
}

message ControlRequest {
  string request_id = 1;
  oneof command {
    Empty ready = 10;
    OpenRequest open = 11;
    SourceCall invoke = 12;
    CancelSourceRequest cancel = 13;
    AcquireImage acquire_image = 14;
    CancelImage cancel_image = 15;
    ReleaseImage release_image = 16;
    ClosePageSession close_page_session = 17;
    Empty rebuild = 18;
    ApiFetchRequest fetch_api = 19;
    Empty dispose = 20;
    PrepareBuildRequest prepare_build = 21;
    CancelPreparationRequest cancel_preparation = 22;
    Empty extension_cache = 23;
    ForgetExtensionArtifactRequest forget_extension_artifact = 24;
    CloseBuildRequest close_build = 25;
  }
}
message ControlResponse {
  string request_id = 1;
  oneof result {
    RuntimeHello hello = 10;
    RuntimeSession session = 11;
    SourceResult source = 12;
    ImageResource image = 13;
    Released released = 14;
    Closed closed = 15;
    Completed completed = 16;
    ApiFetchResponse api = 17;
    RuntimeError error = 18;
    PreparedBuild prepared_build = 19;
    ExtensionCacheState extension_cache = 20;
  }
}

message OpenWorker {
  BuildManifest manifest = 1;
  string user_agent = 2;
  PreferenceBootstrap preference_bootstrap = 3;
}
message AcquireImageWorker {
  AcquireImage request = 1;
  string resource_id = 2;
}
message WorkerCommand {
  RpcEnvelope envelope = 1;
  oneof command {
    OpenWorker open = 10;
    SourceCall invoke = 11;
    AcquireImageWorker acquire_image = 12;
    ClosePageSession close_page_session = 13;
    Empty shutdown = 14;
  }
}
message WorkerResponse {
  RpcEnvelope envelope = 1;
  oneof result {
    RuntimeSession session = 10;
    SourceResult source = 11;
    ProcessedImage image = 12;
    Closed closed = 13;
    RuntimeError error = 14;
  }
}
