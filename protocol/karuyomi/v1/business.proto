syntax = "proto3";

package karuyomi.v1;

import "karuyomi/v1/control.proto";

// Server-owned, account-scoped business state. Authentication is supplied by
// the API transport, never by an identity field in the request body.
message LibraryMetadata {
  string package_name = 1;
  string source_id = 2;
  string source_name = 3;
  string source_lang = 4;
  Manga manga = 5;
}

message MangaResume {
  string chapter_key = 1;
  bool reversed_order = 2;
}

message MangaState {
  string manga_key = 1;
  // Covers every metadata, favorite, category, bookmark, progress and resume mutation.
  uint32 revision = 2;
  LibraryMetadata metadata = 3;
  bool favorite = 4;
  uint32 added_at_seconds = 5;
  MangaResume resume = 6;
  repeated string category_ids = 7;
}

message Category {
  string id = 1;
  string name = 2;
}

message CategoryCatalog {
  uint32 revision = 1;
  repeated Category categories = 2;
}

message SetCategories {
  repeated string category_ids = 1;
  uint32 expected_catalog_revision = 2;
}

message CreateCategory {
  Category category = 1;
}

message RenameCategory {
  string category_id = 1;
  string name = 2;
}

message ReorderCategories {
  repeated string category_ids = 1;
}

message DeleteCategory {
  string category_id = 1;
}

message CategoryMutation {
  uint32 schema_version = 1;
  string mutation_id = 2;
  uint32 expected_revision = 3;
  oneof operation {
    CreateCategory create_category = 10;
    RenameCategory rename_category = 11;
    ReorderCategories reorder_categories = 12;
    DeleteCategory delete_category = 13;
  }
}

message ReadingAnchor {
  string chapter_key = 1;
  string page_key = 2;
  string manifest_version = 3;
  uint32 page_index_hint = 4;
  double normalized_offset = 5;
}

message ChapterProgressState {
  string chapter_key = 1;
  ReadingAnchor current = 2;
  ReadingAnchor furthest = 3;
  uint32 epoch = 4;
  bool completed = 5;
}

// The server projects anchors by page identity, never by a stale index hint.
message ChapterSnapshot {
  string chapter_key = 1;
  string manifest_version = 2;
  repeated string page_keys = 3;
}

message ChapterBookmark {
  string chapter_key = 1;
  bool bookmarked = 2;
}

message SetBookmark {
  string chapter_key = 1;
  bool bookmarked = 2;
}

message SetFavorite {
  LibraryMetadata metadata = 1;
  bool favorite = 2;
}

message SaveProgress {
  ChapterSnapshot snapshot = 1;
  ChapterProgressState progress = 2;
  bool reversed_order = 3;
}

message ResetProgress {
  ChapterSnapshot snapshot = 1;
  bool reversed_order = 2;
}

message StateMutation {
  uint32 schema_version = 1;
  // UUID, retained with the exact acknowledged response for idempotent retries.
  string mutation_id = 2;
  string manga_key = 3;
  uint32 expected_revision = 4;
  oneof operation {
    SetFavorite set_favorite = 10;
    LibraryMetadata update_metadata = 11;
    SaveProgress save_progress = 12;
    ResetProgress reset_progress = 13;
    SetCategories set_categories = 14;
    SetBookmark set_bookmark = 15;
  }
}

enum BusinessStateErrorCode {
  BUSINESS_STATE_ERROR_CODE_UNSPECIFIED = 0;
  BUSINESS_STATE_ERROR_CODE_INVALID_INPUT = 1;
  BUSINESS_STATE_ERROR_CODE_REVISION_CONFLICT = 2;
  BUSINESS_STATE_ERROR_CODE_STALE_EPOCH = 3;
  BUSINESS_STATE_ERROR_CODE_IDEMPOTENCY_CONFLICT = 4;
  BUSINESS_STATE_ERROR_CODE_UNAVAILABLE = 5;
  BUSINESS_STATE_ERROR_CODE_LIMIT_EXCEEDED = 6;
}

message BusinessStateError {
  BusinessStateErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
}

message StateMutationResponse {
  uint32 schema_version = 1;
  string mutation_id = 2;
  uint32 account_revision = 3;
  MangaState manga = 4;
  ChapterProgressState progress = 5;
  BusinessStateError error = 6;
  CategoryCatalog category_catalog = 7;
  ChapterBookmark bookmark = 8;
}

message MangaStateResponse {
  uint32 schema_version = 1;
  uint32 account_revision = 2;
  MangaState manga = 3;
  ChapterProgressState progress = 4;
  BusinessStateError error = 5;
  CategoryCatalog category_catalog = 6;
  ChapterBookmark bookmark = 7;
}

message BookmarkPageResponse {
  uint32 schema_version = 1;
  // Subsequent pages must use this revision; a changed revision restarts paging.
  uint32 account_revision = 2;
  string manga_key = 3;
  // Only bookmarked chapters are included, ordered by chapter identity.
  repeated ChapterBookmark entries = 4;
  string next_key = 5;
  BusinessStateError error = 6;
}

message LibraryPageResponse {
  uint32 schema_version = 1;
  // Subsequent pages must use this revision; a changed revision restarts paging.
  uint32 account_revision = 2;
  repeated MangaState entries = 3;
  string next_key = 4;
  BusinessStateError error = 5;
  CategoryCatalog category_catalog = 6;
}

message CategoryMutationResponse {
  uint32 schema_version = 1;
  string mutation_id = 2;
  uint32 account_revision = 3;
  CategoryCatalog category_catalog = 4;
  BusinessStateError error = 5;
}

message CategoryCatalogResponse {
  uint32 schema_version = 1;
  uint32 account_revision = 2;
  CategoryCatalog category_catalog = 3;
  BusinessStateError error = 4;
}
