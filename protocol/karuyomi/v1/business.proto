syntax = "proto3";

package karuyomi.v1;

import "karuyomi/v1/control.proto";

// Server-owned, account-scoped business state. Authentication is supplied by
// the API transport, never by an identity field in the request body.
message LibraryMetadata {
  string package_name = 1;
  string source_id = 2;
  string source_name = 3;
  string source_lang = 4;
  Manga manga = 5;
}

message MangaResume {
  string chapter_key = 1;
  bool reversed_order = 2;
}

message CustomCover {
  string asset_id = 1;
  string content_type = 2;
  uint32 byte_length = 3;
  string sha256 = 4;
}

message SetCustomCover {
  // Missing cover clears the current custom cover.
  CustomCover cover = 1;
}

message MangaState {
  string manga_key = 1;
  // Covers every metadata, favorite, category, bookmark, progress and resume mutation.
  uint32 revision = 2;
  LibraryMetadata metadata = 3;
  bool favorite = 4;
  uint32 added_at_seconds = 5;
  MangaResume resume = 6;
  repeated string category_ids = 7;
  CustomCover custom_cover = 8;
}

message Category {
  string id = 1;
  string name = 2;
}

message CategoryCatalog {
  uint32 revision = 1;
  repeated Category categories = 2;
}

message SetCategories {
  repeated string category_ids = 1;
  uint32 expected_catalog_revision = 2;
}

message CreateCategory {
  Category category = 1;
}

message RenameCategory {
  string category_id = 1;
  string name = 2;
}

message ReorderCategories {
  repeated string category_ids = 1;
}

message DeleteCategory {
  string category_id = 1;
}

message CategoryMutation {
  uint32 schema_version = 1;
  string mutation_id = 2;
  uint32 expected_revision = 3;
  oneof operation {
    CreateCategory create_category = 10;
    RenameCategory rename_category = 11;
    ReorderCategories reorder_categories = 12;
    DeleteCategory delete_category = 13;
  }
}

message ReadingAnchor {
  string chapter_key = 1;
  string page_key = 2;
  string manifest_version = 3;
  uint32 page_index_hint = 4;
  // Source-image y; viewport coordinates identify where that point appears.
  double normalized_offset = 5;
  // Source-image x is physical and is not mirrored in RTL.
  double normalized_x = 6;
  double viewport_x = 7;
  double viewport_y = 8;
}

message ChapterProgressState {
  string chapter_key = 1;
  // Anchors are absent for an unopened chapter marked from its detail list.
  ReadingAnchor current = 2;
  ReadingAnchor furthest = 3;
  uint32 epoch = 4;
  // Chapter-level read state; only reset or marking unread clears it.
  bool completed = 5;
}

// The server projects anchors by page identity, never by a stale index hint.
message ChapterSnapshot {
  string chapter_key = 1;
  string manifest_version = 2;
  repeated string page_keys = 3;
}

message ChapterBookmark {
  string chapter_key = 1;
  bool bookmarked = 2;
}

message SetBookmark {
  string chapter_key = 1;
  bool bookmarked = 2;
}

message SetChapterRead {
  string chapter_key = 1;
  bool read = 2;
}

message SetFavorite {
  LibraryMetadata metadata = 1;
  bool favorite = 2;
}

message SaveProgress {
  ChapterSnapshot snapshot = 1;
  ChapterProgressState progress = 2;
  bool reversed_order = 3;
}

message ResetProgress {
  ChapterSnapshot snapshot = 1;
  bool reversed_order = 2;
}

// Explicit user-confirmed one-to-one chapter identities; flags select positive
// source read/bookmark state only. Source page anchors never cross sources.
message ChapterMigration {
  string source_chapter_key = 1;
  string target_chapter_key = 2;
  bool copy_read = 3;
  bool copy_bookmark = 4;
}

message MigrateFrom {
  string source_manga_key = 1;
  uint32 expected_source_revision = 2;
  uint32 expected_catalog_revision = 3;
  LibraryMetadata target_metadata = 4;
  bool copy_categories = 5;
  repeated ChapterMigration chapters = 6;
}

message MigrationResult {
  uint32 copied_read_chapters = 1;
  uint32 copied_bookmarks = 2;
}

message StateMutation {
  uint32 schema_version = 1;
  // UUID, retained with the exact acknowledged response for idempotent retries.
  string mutation_id = 2;
  string manga_key = 3;
  uint32 expected_revision = 4;
  oneof operation {
    SetFavorite set_favorite = 10;
    LibraryMetadata update_metadata = 11;
    SaveProgress save_progress = 12;
    ResetProgress reset_progress = 13;
    SetCategories set_categories = 14;
    SetBookmark set_bookmark = 15;
    SetChapterRead set_chapter_read = 16;
    SetCustomCover set_custom_cover = 17;
    MigrateFrom migrate_from = 18;
  }
}

enum BusinessStateErrorCode {
  BUSINESS_STATE_ERROR_CODE_UNSPECIFIED = 0;
  BUSINESS_STATE_ERROR_CODE_INVALID_INPUT = 1;
  BUSINESS_STATE_ERROR_CODE_REVISION_CONFLICT = 2;
  BUSINESS_STATE_ERROR_CODE_STALE_EPOCH = 3;
  BUSINESS_STATE_ERROR_CODE_IDEMPOTENCY_CONFLICT = 4;
  BUSINESS_STATE_ERROR_CODE_UNAVAILABLE = 5;
  BUSINESS_STATE_ERROR_CODE_LIMIT_EXCEEDED = 6;
}

message BusinessStateError {
  BusinessStateErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
}

message StateMutationResponse {
  uint32 schema_version = 1;
  string mutation_id = 2;
  uint32 account_revision = 3;
  MangaState manga = 4;
  ChapterProgressState progress = 5;
  BusinessStateError error = 6;
  CategoryCatalog category_catalog = 7;
  ChapterBookmark bookmark = 8;
  MigrationResult migration = 9;
}

message MangaStateResponse {
  uint32 schema_version = 1;
  uint32 account_revision = 2;
  MangaState manga = 3;
  ChapterProgressState progress = 4;
  BusinessStateError error = 5;
  CategoryCatalog category_catalog = 6;
  ChapterBookmark bookmark = 7;
}

message BookmarkPageResponse {
  uint32 schema_version = 1;
  // Subsequent pages must use this revision; a changed revision restarts paging.
  uint32 account_revision = 2;
  string manga_key = 3;
  // Only bookmarked chapters are included, ordered by chapter identity.
  repeated ChapterBookmark entries = 4;
  string next_key = 5;
  BusinessStateError error = 6;
}

message ChapterProgressPageResponse {
  uint32 schema_version = 1;
  // Subsequent pages must use this revision; a changed revision restarts paging.
  uint32 account_revision = 2;
  string manga_key = 3;
  // Stored read/unread epochs and optional anchors, ordered by chapter identity.
  repeated ChapterProgressState entries = 4;
  string next_key = 5;
  BusinessStateError error = 6;
}

message LibraryPageResponse {
  uint32 schema_version = 1;
  // Subsequent pages must use this revision; a changed revision restarts paging.
  uint32 account_revision = 2;
  repeated MangaState entries = 3;
  string next_key = 4;
  BusinessStateError error = 5;
  CategoryCatalog category_catalog = 6;
}

message CategoryMutationResponse {
  uint32 schema_version = 1;
  string mutation_id = 2;
  uint32 account_revision = 3;
  CategoryCatalog category_catalog = 4;
  BusinessStateError error = 5;
}

message CategoryCatalogResponse {
  uint32 schema_version = 1;
  uint32 account_revision = 2;
  CategoryCatalog category_catalog = 3;
  BusinessStateError error = 4;
}

enum AppTheme {
  APP_THEME_UNSPECIFIED = 0;
  APP_THEME_SYSTEM = 1;
  APP_THEME_LIGHT = 2;
  APP_THEME_DARK = 3;
}

enum ReaderMode {
  READER_MODE_UNSPECIFIED = 0;
  READER_MODE_LEFT_TO_RIGHT = 1;
  READER_MODE_RIGHT_TO_LEFT = 2;
  READER_MODE_CONTINUOUS = 3;
  READER_MODE_WEBTOON = 4;
}

enum ReaderPageLayout {
  READER_PAGE_LAYOUT_UNSPECIFIED = 0;
  READER_PAGE_LAYOUT_AUTO = 1;
  READER_PAGE_LAYOUT_SINGLE = 2;
  READER_PAGE_LAYOUT_DOUBLE = 3;
}

enum ReaderBackground {
  READER_BACKGROUND_UNSPECIFIED = 0;
  READER_BACKGROUND_BLACK = 1;
  READER_BACKGROUND_WHITE = 2;
  READER_BACKGROUND_THEME = 3;
}

enum ReaderInputPreset {
  READER_INPUT_PRESET_UNSPECIFIED = 0;
  READER_INPUT_PRESET_STANDARD = 1;
  READER_INPUT_PRESET_REVERSED = 2;
  READER_INPUT_PRESET_DISABLED = 3;
}

enum ReaderFit {
  READER_FIT_UNSPECIFIED = 0;
  READER_FIT_CONTAIN = 1;
  READER_FIT_WIDTH = 2;
  READER_FIT_HEIGHT = 3;
}

message ReaderSettings {
  ReaderMode mode = 1;
  ReaderPageLayout page_layout = 2;
  ReaderBackground background = 3;
  // Reading-content dimming only; never changes platform display brightness.
  uint32 dim_percent = 4;
  ReaderInputPreset tap_zones = 5;
  ReaderInputPreset keyboard = 6;
  ReaderFit fit = 7;
  bool crop_borders = 8;
}

// Missing fields inherit the global reader preference. AUTO is an explicit
// value, distinct from inheritance. An empty message clears all overrides.
message ReaderSettingsOverride {
  optional ReaderMode mode = 1;
  optional ReaderPageLayout page_layout = 2;
  optional ReaderBackground background = 3;
  optional uint32 dim_percent = 4;
  optional ReaderInputPreset tap_zones = 5;
  optional ReaderInputPreset keyboard = 6;
  optional ReaderFit fit = 7;
  optional bool crop_borders = 8;
}

// Source identity stays independent of the currently published build or runtime.
// Names and languages are display snapshots, never identity components.
message FavoriteSource {
  string package_name = 1;
  string source_id = 2;
  string source_name = 3;
  string source_lang = 4;
}

// Confirmed account intent, separate from each client's disposable code cache.
// A package has one selected repository/build; replacement is explicit.
message InstalledExtension {
  string catalog_url = 1;
  string repo_id = 2;
  string package_name = 3;
  string build_id = 4;
  string bundle_sha256 = 5;
  bool enabled = 6;
}

message ExtensionRepository {
  string catalog_url = 1;
  string repo_id = 2;
  string name = 3;
}

message ExtensionNetworkPolicy {
  string build_id = 1;
  string package_name = 2;
  string bundle_sha256 = 3;
}

message ExtensionNetworkPoliciesResponse {
  uint32 schema_version = 1;
  CatalogReference catalog = 2;
  repeated ExtensionNetworkPolicy builds = 3;
}

message GlobalSettingsValues {
  AppTheme theme = 1;
  ReaderSettings reader = 2;
  repeated FavoriteSource favorite_sources = 3;
  repeated InstalledExtension installed_extensions = 4;
  repeated ExtensionRepository repositories = 5;
}

message GlobalSettings {
  uint32 revision = 1;
  GlobalSettingsValues values = 2;
}

message MangaReaderSettings {
  string manga_key = 1;
  uint32 revision = 2;
  ReaderSettingsOverride overrides = 3;
}

message SetMangaReaderSettings {
  string manga_key = 1;
  ReaderSettingsOverride overrides = 2;
}

message SettingsMutation {
  uint32 schema_version = 1;
  string mutation_id = 2;
  // CAS for the selected scope, independent of reading-progress revisions.
  uint32 expected_revision = 3;
  oneof operation {
    GlobalSettingsValues set_global = 10;
    SetMangaReaderSettings set_manga = 11;
  }
}

message SettingsResponse {
  uint32 schema_version = 1;
  uint32 account_revision = 2;
  GlobalSettings global = 3;
  // Present only for a manga-scoped request, even when no row exists yet.
  MangaReaderSettings manga = 4;
  ReaderSettings effective_reader = 5;
  BusinessStateError error = 6;
}

message SettingsMutationResponse {
  uint32 schema_version = 1;
  string mutation_id = 2;
  uint32 account_revision = 3;
  GlobalSettings global = 4;
  MangaReaderSettings manga = 5;
  ReaderSettings effective_reader = 6;
  BusinessStateError error = 7;
}

// Source values are independent of reading settings and build/generation IDs.
// Full replacement allows removing a stored key without conflating it with
// false, zero, an empty string or an empty string set.
message SourcePreferences {
  string package_name = 1;
  string source_id = 2;
  uint32 revision = 3;
  repeated PreferenceEntry entries = 4;
}
message SourcePreferencesResponse {
  uint32 schema_version = 1;
  uint32 account_revision = 2;
  string package_name = 3;
  repeated SourcePreferences sources = 4;
  BusinessStateError error = 5;
  CatalogReference catalog = 6;
  repeated PreferenceSyncRule sync_rules = 7;
}
message SourcePreferencesMutation {
  uint32 schema_version = 1;
  string mutation_id = 2;
  string package_name = 3;
  string source_id = 4;
  uint32 expected_revision = 5;
  repeated PreferenceEntry entries = 6;
  CatalogReference catalog = 7;
}
message SourcePreferencesMutationResponse {
  uint32 schema_version = 1;
  string mutation_id = 2;
  uint32 account_revision = 3;
  SourcePreferences preferences = 4;
  BusinessStateError error = 5;
  CatalogReference catalog = 6;
  repeated PreferenceSyncRule sync_rules = 7;
}
