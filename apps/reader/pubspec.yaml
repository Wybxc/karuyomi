name: karuyomi
description: Personal manga reader with a shared browser-hosted Source runtime.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  uuid: 4.6.0
  path_provider: 2.1.6
  flutter_inappwebview: 6.2.0-beta.3
  reader_core:
    path: ../../packages/reader_core
  source_runtime:
    path: ../../packages/source_runtime
  cross_file: 0.3.5+2
  web: 1.1.2
  image: 4.12.0
  http: 1.6.0
  http_parser: 4.1.2
  file_selector: 1.1.0
  pool: 1.5.3
dev_dependencies:
  protobuf: 6.1.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file_selector_platform_interface: 2.7.0
flutter:
  uses-material-design: true
  assets:
    - assets/runtime/
