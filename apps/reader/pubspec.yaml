name: karuyomi
description: Personal manga reader with a shared browser-hosted Source runtime.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  uuid: 4.6.0
  collection: 1.19.1
  path_provider: 2.1.6
  flutter_inappwebview: 6.2.0-beta.3
  reader_core:
    path: ../../packages/reader_core
  source_runtime:
    path: ../../packages/source_runtime
  cross_file: 0.3.5+2
  web: 1.1.2
  image: 4.12.0
  http: 1.6.0
  http_parser: 4.1.2
  file_selector: 1.1.0
  pool: 1.5.3
  shared_preferences: 2.5.6
  hooks_riverpod: 3.5.0
  flutter_hooks: 0.21.4
  riverpod_annotation: 4.0.8
  material_ui: 1.11.0
dev_dependencies:
  build_runner: 2.17.1
  riverpod_generator: 4.0.10
  protobuf: 6.1.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file_selector_platform_interface: 2.7.0
flutter:
  uses-material-design: true
  assets:
    - assets/runtime/
