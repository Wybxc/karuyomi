name: karuyomi
description: Personal manga reader with a shared browser-hosted Source runtime.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  drift: 2.35.3
  drift_flutter: 0.3.1
  path_provider: 2.1.6
  flutter_inappwebview: 6.1.5
  reader_core:
    path: ../../packages/reader_core
  source_runtime:
    path: ../../packages/source_runtime
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.2
  build_runner: 2.17.1
flutter:
  uses-material-design: true
  assets:
    - assets/runtime/
